<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>베테랑 프레스킷</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#3b322d;color:#efe6d8;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center;padding:24px}
  a{color:#efe6d8}
</style>
</head>
<body>
<p>베테랑 프레스킷으로 이동하고 있어요…<br><a id="go" href="https://claude.ai/artifact/XFmAGQyhdxdGn46E7ST4rm#ko">바로 이동</a></p>
<script>
(function () {
  // Press kit link for journalists. Records the click on the tracking server in the background, then redirects.
  var KIT = "https://claude.ai/artifact/XFmAGQyhdxdGn46E7ST4rm";
  var TRACK = "https://script.google.com/macros/s/AKfycbxKqqJhJmY65kHpgfvfltI-hFYRVryOoXP6MuFzZXgjrMFXmyvJaZ9Q7Xcl7KMqtlL0/exec";
  var q = new URLSearchParams(location.search);
  var t = q.get("t") || "";
  var lang = q.get("l") === "en" ? "en" : "ko";
  var dest = KIT + "#" + lang;
  document.getElementById("go").href = dest;
  var done = false;
  function go() { if (!done) { done = true; location.replace(dest); } }
  if (/^[A-Za-z0-9_-]{22}$/.test(t)) {
    try {
      fetch(TRACK + "?b=1&t=" + encodeURIComponent(t), { mode: "no-cors", keepalive: true }).then(go, go);
    } catch (e) { go(); }
    setTimeout(go, 1200);
  } else { go(); }
})();
</script>
</body>
</html>
